[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hm-recsys"
version = "1.0.0"
description = "Production-grade multi-stage recommendation system for H&M fashion dataset"
authors = [{ name = "Applied Scientist" }]
requires-python = ">=3.10"
dependencies = [
    "polars>=0.20",
    "torch>=2.0",
    "lightgbm>=4.0",
    "implicit>=0.7",
    "faiss-cpu>=1.7",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "loguru>=0.7",
    "typer>=0.9",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "tqdm>=4.66",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "shap>=0.44",
    "umap-learn>=0.5",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.5",
    "ruff>=0.1",
    "black>=23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*"]
